[package]
name = "dapan"
version = "1.0.0"
edition = "2024"

[dependencies]
anyhow = "1.0.105"
async-trait = "0.1.92"
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
dotenvy = "0.15.7"
ical = "0.11.0"
msedge-tts = { version = "0.4.1", default-features = false, features = ["tokio-runtime"] }
poise = "0.7.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serenity = { version = "0.12.5", default-features = false, features = ["client", "gateway", "model", "cache", "voice", "rustls_backend"] }
songbird = { version = "0.6.1", features = ["builtin-queue"] }
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "chrono"] }
symphonia = { version = "0.5", features = ["aac", "mp3", "isomp4", "mkv", "ogg", "vorbis", "wav", "pcm"] }
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[patch.crates-io]
# Local copy with a connection fix, see vendor/msedge-tts/src/tts/mod.rs ("Patched for dapan").
msedge-tts = { path = "vendor/msedge-tts" }
